name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v1.0.0 (the tag must already exist)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Check that the tag matches the crate version
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$tag' is not a v<major>.<minor>.<patch> tag, refusing to release."
            exit 1
          fi
          version="${tag#v}"
          manifest=$(awk '/^\[package\]/{f=1;next} /^\[/{f=0} f && $1=="version"{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)
          lock=$(grep -m1 -A1 '^name = "vine"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p' || true)
          echo "tag=$tag, Cargo.toml=$manifest, Cargo.lock=$lock"
          if [ "$manifest" != "$version" ] || [ "$lock" != "$version" ]; then
            echo "::error::The tag '$tag' does not match Cargo.toml ($manifest) and Cargo.lock ($lock); bump the version first."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: verify
    strategy:
      matrix:
        targets:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.targets.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - name: Setup
        run: rustup target add ${{ matrix.targets.target }}
      - name: Build
        uses: houseabsolute/actions-rust-cross@21b0f18dc621b25bfae556ff2791fca4173121e8 # v1.0.8
        with:
          command: build
          target: ${{ matrix.targets.target }}
          args: "--release"
      - name: Archive
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TARGET: ${{ matrix.targets.target }}
        run: |
          set -euo pipefail
          tar -czf "vine-${VERSION}-${TARGET}.tar.gz" -C "target/${TARGET}/release" vine
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.targets.target }}
          path: vine-${{ needs.verify.outputs.version }}-${{ matrix.targets.target }}.tar.gz
          if-no-files-found: error
  release:
    needs:
      - verify
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: releases
          pattern: release-*
          merge-multiple: true
      - name: Generate checksums
        working-directory: releases
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Create Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          draft: true
          generate_release_notes: true
          make_latest: true
          files: |
            releases/*
